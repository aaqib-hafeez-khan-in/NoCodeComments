name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  NODE_OPTIONS: --enable-source-maps

jobs:
  test:
    name: Test / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package.json

      - name: Validate package metadata
        run: npm pkg get name version type engines

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check src/languages.js
          node --check src/comment-stripper.js
          node --check test/comment-stripper.test.js

      - name: Run test suite
        run: npm test

      - name: Run targeted smoke tests
        run: |
          node --input-type=module <<'NODE'
          import { stripComments } from './src/comment-stripper.js';

          const cases = [
            {
              language: 'javascript',
              input: 'const url = "https://example.com/a//b"; // remove\n/* remove */ const value = 1;',
              expected: 'const url = "https://example.com/a//b"; \n const value = 1;'
            },
            {
              language: 'python',
              input: 'url = "https://example.com/a#b" # remove',
              expected: 'url = "https://example.com/a#b" '
            },
            {
              language: 'html',
              input: '<div><!-- remove --><span>keep</span></div>',
              expected: '<div><span>keep</span></div>'
            }
          ];

          for (const testCase of cases) {
            const actual = stripComments(testCase.input, testCase.language);
            if (actual !== testCase.expected) {
              throw new Error(`Smoke test failed for ${testCase.language}: ${JSON.stringify(actual)}`);
            }
          }
          NODE

  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required project files
        run: |
          test -f index.html
          test -f app.js
          test -f src/comment-stripper.js
          test -f src/languages.js
          test -f package.json
          test -f README.md
          test -f legacy/index.html
          test -f legacy/script.js

      - name: Verify legacy link is present
        run: |
          grep -qi "legacy" index.html
          grep -q 'href="./legacy/"' index.html

      - name: Verify CI configuration
        run: |
          grep -q "node --test" package.json
          grep -q "NoCodeComments" README.md

      - name: Check for accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.min.js' \
            '(gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----)' .; then
            echo "Potential secret material detected."
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund

      - name: Run npm audit
        run: npm audit --audit-level=high

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs:
      - test
      - repository-integrity
      - audit
    if: always()

    steps:
      - name: Evaluate required checks
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test matrix failed."
            exit 1
          fi
          if [[ "${{ needs.repository-integrity.result }}" != "success" ]]; then
            echo "Repository integrity checks failed."
            exit 1
          fi
          if [[ "${{ needs.audit.result }}" == "failure" ]]; then
            echo "Dependency audit failed."
            exit 1
          fi
          echo "All required CI checks passed."