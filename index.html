<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Browser-based syntax-aware code comment stripper.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<title>NoCodeComments · strip-comments</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="wordmark" href="./" aria-label="NoCodeComments home">~/strip-comments $</a>
  <div class="topbar-center">
    <label class="language-shell" for="languageSelect"><span>lang:</span><select id="languageSelect" aria-label="Select language"></select></label>
  </div>
  <div class="topbar-actions">
    <button id="themeToggle" class="theme-control" type="button" aria-label="Switch theme"><span id="themeFlag">[■□]</span><span id="themeLabel">--dark</span></button>
    <button id="stripButton" class="button primary" type="button">&gt; strip comments</button>
  </div>
</header>
<main class="app-shell">
  <section class="workspace" aria-label="Code workspace">
    <article class="pane" id="inputPane">
      <div class="pane-tab">
        <span id="inputLabel">input.js · 0 lines</span>
        <span class="pane-actions"><button id="clearButton" class="bracket-button" type="button">[ clear ]</button><button id="inputDownloadButton" class="bracket-button" type="button">[ download ]</button></span>
      </div>
      <div class="editor-wrap" id="inputEditorWrap">
        <div class="gutter" id="inputGutter" aria-hidden="true"><span>1</span></div>
        <textarea id="codeInput" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Input code" placeholder="// paste code here, or drop a file"></textarea>
      </div>
      <div class="pane-footer"><span id="inputFileName">stdin</span><label class="file-button">&gt; open file<input id="fileInput" type="file" hidden></label></div>
    </article>
    <article class="pane" id="outputPane">
      <div class="pane-tab">
        <span id="outputLabel">output.js · 0 lines</span>
        <span class="pane-actions"><button id="copyButton" class="bracket-button" type="button">[ copy ]</button><button id="outputDownloadButton" class="bracket-button" type="button">[ download ]</button></span>
      </div>
      <div class="output-status" id="outputStatus" aria-live="polite"></div>
      <div class="editor-wrap output-wrap" id="outputEditorWrap">
        <div class="gutter" id="outputGutter" aria-hidden="true"><span>1</span></div>
        <textarea id="outputCode" readonly spellcheck="false" aria-label="Output code"></textarea>
      </div>
    </article>
  </section>
  <section class="statsbar" id="statsbar" aria-live="polite">
    <span>comments: <b id="commentsStat">0</b></span><span>|</span><span>bytes saved: <b id="bytesStat">0</b></span><span>|</span><span>lines removed: <b id="linesStat">0</b></span><span>|</span><span id="statusStat">awaiting input...</span>
  </section>
  <details class="snippet-tray" id="snippetTray">
    <summary>&gt; test snippets</summary>
    <div class="snippet-grid">
      <button class="snippet" data-language="javascript"><span>javascript</span><small>strings + line/block comments</small></button>
      <button class="snippet" data-language="python"><span>python</span><small>strings + triple strings</small></button>
      <button class="snippet" data-language="java"><span>java</span><small>line + block comments</small></button>
      <button class="snippet" data-language="html"><span>html</span><small>markup comment protection</small></button>
      <button class="snippet" data-language="css"><span>css</span><small>URL + block comments</small></button>
      <button class="snippet" data-language="sql"><span>sql</span><small>SQL line + block comments</small></button>
    </div>
  </details>
  <footer class="app-footer"><a href="./legacy/">&gt; legacy version</a></footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
