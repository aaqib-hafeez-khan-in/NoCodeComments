<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal Comment Remover</title>
  <!-- TailwindCSS for modern styling -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Prism.js CSS for syntax highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-gray-100">
  <div class="container mx-auto p-4">
    <h1 class="text-4xl font-bold text-center mb-6">Universal Comment Remover</h1>
    <div class="flex flex-col md:flex-row md:space-x-4">
      <!-- Input Section -->
      <div class="w-full md:w-1/2 mb-4">
        <label for="codeInput" class="block text-lg font-medium mb-2">Input Code</label>
        <textarea id="codeInput" rows="15" class="w-full p-2 rounded bg-gray-800 text-gray-100 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Paste your code here..."></textarea>
        <div class="mt-2 flex items-center space-x-2">
          <input type="file" id="fileInput" class="hidden" accept=".js,.py,.java,.cpp,.html,.css,.txt">
          <button id="uploadBtn" class="px-4 py-2 bg-indigo-600 rounded hover:bg-indigo-700 transition">Upload File</button>
          <span id="uploadStatus" class="text-sm text-gray-400"></span>
        </div>
      </div>
      <!-- Output Section -->
      <div class="w-full md:w-1/2">
        <label for="processedCode" class="block text-lg font-medium mb-2">Processed Code</label>
        <pre id="processedCode" class="p-2 rounded bg-gray-800 overflow-auto">
<code class="language-none"></code>
        </pre>
        <div class="mt-2 flex space-x-2">
          <button id="copyBtn" class="px-4 py-2 bg-green-600 rounded hover:bg-green-700 transition">Copy to Clipboard</button>
          <button id="downloadBtn" class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-700 transition">Download</button>
        </div>
      </div>
    </div>
    <!-- Language Selection -->
    <div class="mt-6">
      <label for="languageSelect" class="block text-lg font-medium mb-2">
        Select Language (Optional, auto-detected if left blank)
      </label>
      <select id="languageSelect" class="w-full p-2 rounded bg-gray-800 text-gray-100 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Auto Detect</option>
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
        <option value="java">Java</option>
        <option value="cpp">C++</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
      </select>
    </div>
  </div>

  <!-- Prism.js Scripts for Syntax Highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
